mkdir -p .github/workflows
cat > .github/workflows/build-dmg.yml <<'YAML'
name: Build DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the app and DMG filename
        required: true
        default: "1.0.0"
        type: string

jobs:
  build-dmg:
    name: Build Swar DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Swar installer
        env:
          SWAR_VERSION: ${{ inputs.version }}
          SWAR_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-macos.sh dist

      - name: Upload DMG and related artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Swar-${{ inputs.version }}-build-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
